# Second jump host on a documentation address (RFC 5737) and a non-default port.
# Clients that sit behind it set ProxyJump jumphost. This block itself has no ProxyJump.
# ValidateKnownHosts: pin jumphost before you use it as a hop. See KNOWN_HOSTS.md.

Host jumphost
    HostName 198.51.100.20
    User jump
    Port 2222
    IdentityFile ~/.ssh/id_ed25519_jumphost
    IdentitiesOnly yes
    ForwardAgent no
    ServerAliveInterval 30
    ServerAliveCountMax 3
    StrictHostKeyChecking yes
