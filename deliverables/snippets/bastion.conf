# Bastion snippet. Direct SSH, no ProxyJump.
# ValidateKnownHosts: StrictHostKeyChecking stays yes. See KNOWN_HOSTS.md.
# Agent forwarding stays off. Add it only for a session that needs it.

Host bastion
    HostName bastion.example.com
    User jump
    Port 22
    IdentityFile ~/.ssh/id_ed25519_bastion
    IdentitiesOnly yes
    ForwardAgent no
    ServerAliveInterval 30
    ServerAliveCountMax 3
    StrictHostKeyChecking yes
